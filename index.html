.cur span{font-size:12px;font-weight:800;letter-spacing:.1em;color:#FFFAC9;opacity:0;transition:opacity .2s;text-transform:uppercase}
.cur.show{opacity:1}

@media (hover:hover) and (pointer:fine){body,a,button{cursor:none}}

.has-io .rv:not(.in){opacity:0;transform:translateY(46px)}
.rv{transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform 1s cubic-bezier(.2,.8,.2,1)}

.hrow{display:flex;justify-content:center;white-space:nowrap;font-weight:900;font-size:clamp(50px,13.4vw,224px);line-height:.8;letter-spacing:-.045em;text-transform:uppercase;user-select:none}

.cnt{padding:34px 20px 34px 0;border-bottom:1.5px solid #3c3844;display:flex;flex-direction:column;gap:10px}
.cnt strong{font-weight:900;font-size:clamp(52px,6.4vw,104px);letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums}
.cnt strong em{font-style:normal;color:#C7C804}
.cnt span{font-size:15px;line-height:1.35;color:#D9C6FA;max-width:220px}
.idx{display:flex;flex-direction:column;border-bottom:1.5px solid #3c3844}
.idx-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:20px;padding:26px 0;border-top:1.5px solid #3c3844;text-decoration:none;color:#FFFAC9;transition:padding .45s cubic-bezier(.2,.9,.3,1.3),background .3s}

.pv{position:fixed;left:0;top:0;z-index:90;width:240px;aspect-ratio:4/5;border-radius:10px;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .3s,scale .3s;scale:.85;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}

@media (max-width:980px){.nav-links{display:none}.menu-btn{display:inline-flex}}
@media (max-width:640px){.r3{-webkit-text-stroke:1.2px #D9C6FA}.outline{-webkit-text-stroke:1.2px currentColor}.clink small{min-width:0}.nav-contact-label{display:none}.idx-row{grid-template-columns:minmax(0,1fr) auto}.idx-row .n{display:none}.nav-in{gap:8px}.lang{padding:0 10px}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.has-io .rv:not(.in){opacity:1;transform:none}.has-io .rv-mask:not(.in){clip-path:none}}
</style>
