<script>
var BLOB_FILES = {};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.page = 'sobre';
    let lang = 'es';
    try { const v = window.localStorage.getItem('dt-lang'); if (v === 'en' || v === 'es') lang = v; } catch (err) {}
    this.state = { lang, navHidden: false, scrolled: false, contactOpen: false, menuOpen: false, lb: null, copied: false, exp: 0 };
    this.mx = -9999; this.my = -9999; this.lastY = 0;
    this.titles = { es: 'Sobre mí — Danna Tomás', en: 'About me — Danna Tomás' };
  }
  L(es, en) { return this.state.lang === 'en' ? en : es; }
  applyLang() { try { document.documentElement.lang = this.state.lang; document.title = this.titles[this.state.lang]; } catch (err) {} }
  collectFx() { this.fx = Array.prototype.slice.call(document.querySelectorAll('[data-fx]')).map((a) => ({ a, s: Array.prototype.slice.call(a.querySelectorAll('[data-l]')), on: false })); }
  componentDidUpdate(pp, ps) { if (ps.lang !== this.state.lang) { this.applyLang(); this.collectFx(); } }
  componentDidMount() {
    const d = document, root = d.documentElement;
    this.applyLang();
    this.reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    this.fine = !!(window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches);
    root.classList.add('has-io');
    if ('IntersectionObserver' in window) {
      this.rio = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('in'); this.rio.unobserve(en.target); } }), { threshold: 0.1, rootMargin: '0px 0px -5% 0px' });
      d.querySelectorAll('.rv, .rv-mask').forEach((el) => this.rio.observe(el));
    } else { d.querySelectorAll('.rv, .rv-mask').forEach((el) => el.classList.add('in')); }
    this.curEl = d.querySelector('[data-cur-dot]');
    this.collectFx();
    this.onMove = (e) => {
      this.mx = e.clientX; this.my = e.clientY;
      if (this.curEl && this.fine) {
        this.curEl.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
        this.curEl.classList.add('show');
        const t = e.target && e.target.closest ? e.target.closest('[data-cur], a, button') : null;
        const ver = !!(t && t.hasAttribute('data-cur'));
        this.curEl.classList.toggle('ver', ver);
        this.curEl.classList.toggle('link', !!t && !ver);
      }
    };
    this.onLeave = () => { if (this.curEl) this.curEl.classList.remove('show'); };
    this.onScroll = () => {
      const y = window.scrollY || root.scrollTop || 0, dy = y - this.lastY, st = {};
      if (dy > 6 && y > 140 && !this.state.navHidden && !this.state.contactOpen && !this.state.menuOpen) st.navHidden = true;
      if (dy < -6 && this.state.navHidden) st.navHidden = false;
      if ((y > 40) !== this.state.scrolled) st.scrolled = y > 40;
      if (Object.keys(st).length) this.setState(st);
      this.lastY = y;
    };
    window.addEventListener('pointermove', this.onMove, { passive: true });
    d.addEventListener('mouseleave', this.onLeave);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.tick = () => { this.raf = requestAnimationFrame(this.tick); if (this.reduce || !this.fine) return; this.fx.forEach((g) => this.letters(g)); };
    this.raf = requestAnimationFrame(this.tick);
  }
  letters(g) {
    if (!g.s.length) return;
    const r = g.a.getBoundingClientRect();
    const inside = this.mx > r.left - 60 && this.mx < r.right + 60 && this.my > r.top - 60 && this.my < r.bottom + 60;
    if (!inside) { if (g.on) { g.s.forEach((s) => { s.style.fontWeight = ''; s.style.transform = ''; }); g.on = false; } return; }
    g.on = true;
    g.s.forEach((s) => {
      const b = s.getBoundingClientRect();
      const f = Math.max(0, 1 - Math.hypot(this.mx - (b.left + b.width / 2), this.my - (b.top + b.height / 2)) / 240);
      s.style.fontWeight = String(Math.round(900 - 720 * f));
      s.style.transform = f > 0 ? 'translateY(' + (-12 * f).toFixed(1) + 'px)' : '';
    });
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    window.removeEventListener('pointermove', this.onMove);
    window.removeEventListener('scroll', this.onScroll);
    document.removeEventListener('mouseleave', this.onLeave);
    if (this.rio) this.rio.disconnect();
  }
  kitVals() {
    const s = this.state, en = s.lang === 'en', L = this.L.bind(this), lb = s.lb, it = lb ? lb.list[lb.i] : null;
    const pages = [['sandmade', 'Sandmade', 'Sandmade', 'sandmade.html'], ['inroads', 'Google x INROADS', 'Google x INROADS', 'google-x-inroads.html'], ['regio', 'Regio Operadora', 'Regio Operadora', 'regio-operadora.html'], ['ugc', 'UGC', 'UGC', 'ugc.html'], ['modelaje', 'Modelaje', 'Modeling', 'modelaje.html'], ['sobre', 'Sobre mí', 'About me', 'sobre-mi.html']];
    return {
      lang: s.lang,
      esCls: en ? '' : 'on', enCls: en ? 'on' : '',
      toggleLang: () => { const l = this.state.lang === 'es' ? 'en' : 'es'; try { window.localStorage.setItem('dt-lang', l); } catch (err) {} this.setState({ lang: l }); },
      t: {
        navLabel: L('Principal', 'Main'), homeLabel: L('Danna Tomás — inicio', 'Danna Tomás — home'), home: L('Inicio', 'Home'),
        langLabel: L('Cambiar idioma a inglés', 'Switch language to Spanish'), contact: L('Contacto', 'Contact'), mail: L('Mail', 'Email'),
        copied: L('¡copiado!', 'copied!'), copyLabel: L('Copiar correo', 'Copy email'),
        contactTitle: L('¿Creamos algo juntos?', 'Let’s create together'),
        close: L('Cerrar', 'Close'),
        portrait: L('Retrato de Danna Tomás en blanco y negro', 'Black and white portrait of Danna Tomás')
      },
      navItems: pages.map((p) => ({ label: en ? p[2] : p[1], href: p[3], cls: this.page === p[0] ? 'on' : '' })),
      navTransform: s.navHidden ? 'translateY(-110%)' : 'translateY(0)',
      navBg: s.scrolled || s.menuOpen ? 'rgba(35, 33, 41, .72)' : 'rgba(35, 33, 41, 0)',
      navBlur: s.scrolled ? '14px' : '0px',
      contactOpen: s.contactOpen, menuOpen: s.menuOpen, menuLabel: s.menuOpen ? L('Cerrar', 'Close') : L('Menú', 'Menu'),
      toggleContact: () => this.setState({ contactOpen: !this.state.contactOpen, menuOpen: false }),
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen, contactOpen: false }),
      contactWords: (en ? ['LET’S', 'CREATE', 'TOGETHER'] : ['¿CREAMOS', 'ALGO', 'JUNTOS?']).map((w) => ({ letters: w.split('').map((c) => ({ c })) })),
      copyEmail: () => {
        const done = () => { this.setState({ copied: true }); clearTimeout(this._ct); this._ct = setTimeout(() => this.setState({ copied: false }), 2000); };
        try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText('danna.tomii@gmail.com').then(done, done); else done(); } catch (err) { done(); }
      },
      copied: s.copied,
      lbOpen: !!lb, lbSrc: it ? it.src : '', lbAlt: it ? it.alt : '',
      lbClose: (e) => { if (e) e.stopPropagation(); this.setState({ lb: null }); },
      lbBackdrop: (e) => { if (e.target === e.currentTarget) this.setState({ lb: null }); }
    };
  }
  renderVals() {
    const s = this.state, L = this.L.bind(this);
    const items = [
      { name: 'Sandmade Swimwear', years: L('ene 2025 — hoy', 'Jan 2025 — present'), role: 'Social Media & Project Manager', href: 'sandmade.html',
        body: L('Estrategia de contenido, campañas mensuales y de temporada, dirección creativa de sesiones de foto y video, curaduría del feed y análisis de métricas. Instagram de 36.4K a 60.6K seguidores, ~8 activaciones y coordinación de +50 personas.', 'Content strategy, monthly and seasonal campaigns, creative direction of photo and video shoots, feed curation and metrics analysis. Grew Instagram from 36.4K to 60.6K followers, ran ~8 activations and coordinated 50+ people.') },
      { name: 'Regio Operadora', years: L('mar 2024 — mar 2026', 'Mar 2024 — Mar 2026'), role: 'Social Media & Content Strategist', href: 'regio-operadora.html',
        body: L('Contenido B2B para agentes de viaje, campañas con cooperadores como Kissimmee, República Dominicana y Colorado, material para ~12 eventos y 7 webinars, evento en República Dominicana con +200 agentes y desarrollo de Viva 100 con Volaris.', 'B2B content for travel agents, campaigns with partners such as Kissimmee, the Dominican Republic and Colorado, materials for ~12 events and 7 webinars, an event in the Dominican Republic with 200+ agents, and development of Viva 100 with Volaris.') },
      { name: 'INROADS', years: L('feb 2023 — feb 2024', 'Feb 2023 — Feb 2024'), role: L('Community Manager e IT Support', 'Community Manager & IT Support'), href: 'google-x-inroads.html',
        body: L('Comunidad de +2,000 becarios y contenido junto a Grow with Google: caso de éxito, video corporativo y piezas de contenido.', 'A community of 2,000+ interns and content alongside Grow with Google: a success story, a corporate video and content pieces.') },
      { name: 'Chok Chok Beauty', years: L('ene — mar 2023', 'Jan — Mar 2023'), role: L('Creative Strategist & Content Manager · Marketing de influencers, UGC', 'Creative Strategist & Content Manager · Influencer marketing, UGC'), href: '',
        body: L('Estrategia y creación de contenido para Facebook, Instagram y TikTok, montaje de iluminación y set, parrillas de contenido, pauta pagada y reportes de resultados.', 'Content strategy and creation for Facebook, Instagram and TikTok, lighting and set-up, content calendars, paid ads and results reports.') },
      { name: L('CAGE Psicología BUAP', 'CAGE Psychology BUAP'), years: L('ene 2022 — ene 2023', 'Jan 2022 — Jan 2023'), role: 'Creative Strategist & Social Media', href: '',
        body: L('Estrategia de contenidos y campañas, copywriting, fotografía, logística y host de eventos, y coordinación de un equipo de 8 personas.', 'Content and campaign strategy, copywriting, photography, event logistics and hosting, and leading a team of 8 people.') }
    ];
    const timeline = items.map((t, i) => Object.assign({}, t, {
      open: s.exp === i, on: s.exp === i ? 'on' : '', sel: s.exp === i ? 'true' : 'false', showLink: s.exp === i && !!t.href,
      goLabel: L('Ver proyectos →', 'See projects →'),
      pick: () => { if (this.state.exp !== i) this.setState({ exp: i }); }
    }));
    return Object.assign(this.kitVals(), {
      timeline,
      openKit: () => this.setState({ lb: { list: [{ src: 'assets/media-kit-danna-tomas.jpg', alt: L('Media kit de Danna Tomás', 'Danna Tomás media kit') }], i: 0 } })
    });
  }
}

DC.mount(Component);
</script>
